name: Test Telegram - Debug Version

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Debug & Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import os
          import requests

          print("="*60)
          print("TELEGRAM TEST - DEBUG MODE")
          print("="*60)

          token = os.getenv('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '')

          print(f"\n1. Check Secrets:")
          print(f"   Token exists: {bool(token)}")
          print(f"   Chat ID exists: {bool(chat_id)}")

          if not token or not chat_id:
              print("\n❌ ERROR: Secrets not found!")
              print("   Go to: Settings → Secrets → Check TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID")
              exit(1)

          print(f"   Token (first 20): {token[:20]}...")
          print(f"   Chat ID: {chat_id}")

          print(f"\n2. Attempt to send message:")

          try:
              url = f"https://api.telegram.org/bot{token}/sendMessage"

              # Ensure chat_id is string
              chat_id_str = str(chat_id)

              payload = {
                  'chat_id': chat_id_str,
                  'text': '🧪 Test Message\n✅ Codal Agent Telegram Connection OK!'
              }

              print(f"   URL: {url[:50]}...")
              print(f"   Payload: chat_id={chat_id_str}, text=...\n")

              response = requests.post(url, json=payload, timeout=15)

              print(f"   Status: {response.status_code}")
              print(f"   Response: {response.text}\n")

              if response.status_code == 200:
                  print("✅ SUCCESS! Message sent to Telegram")
              else:
                  print("❌ FAILED! Check response above")
                  exit(1)

          except Exception as e:
              print(f"❌ EXCEPTION: {type(e).__name__}")
              print(f"   {str(e)}\n")
              exit(1)

          print("="*60)
          print("Test completed successfully!")
          print("="*60)
          EOF
