name: Test Telegram Connection

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Clone Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: pip install requests

      - name: 🧪 Test Telegram Connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import os
          import requests
          import json

          token = os.getenv('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '')

          print("=" * 50)
          print("🧪 TELEGRAM CONNECTION TEST")
          print("=" * 50)

          # Check if secrets exist
          if not token:
              print("❌ TELEGRAM_BOT_TOKEN not found!")
              exit(1)

          if not chat_id:
              print("❌ TELEGRAM_CHAT_ID not found!")
              exit(1)

          print(f"✅ Token found: {token[:20]}...")
          print(f"✅ Chat ID found: {chat_id}")

          # Try to send test message
          print("\n📤 Attempting to send test message...")

          try:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              payload = {
                  'chat_id': chat_id,
                  'text': '🧪 TEST MESSAGE\n\n✅ Telegram API Connection Works!\n\nCodal Agent is ready to send daily reports.',
                  'parse_mode': 'HTML'
              }

              response = requests.post(url, json=payload, timeout=10)

              print(f"Status Code: {response.status_code}")

              if response.status_code == 200:
                  result = response.json()
                  print(f"✅ SUCCESS!")
                  print(f"Message ID: {result.get('result', {}).get('message_id', 'N/A')}")
              else:
                  print(f"❌ FAILED!")
                  print(f"Response: {response.text}")
                  exit(1)

          except Exception as e:
              print(f"❌ ERROR: {str(e)}")
              exit(1)

          print("\n" + "=" * 50)
          print("✅ All tests passed!")
          print("=" * 50)
          EOF
