name: Codal Daily Agent

on:
  schedule:
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

jobs:
  codal-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Clone Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/codal_agent/requirements.txt
      
      - name: 🤖 Run Codal Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd agents/codal_agent
          python main.py
      
      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codal-reports
          path: agents/codal_agent/report_*.txt
          retention-days: 7
